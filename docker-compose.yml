services:
  also-mcp:
    build: .
    container_name: also-mcp-cloud
    restart: unless-stopped
    environment:
      - ALSO_API_USER=${ALSO_API_USER}
      - ALSO_API_PASSWORD=${ALSO_API_PASSWORD}
      - ALSO_BASE_URL=${ALSO_BASE_URL:-https://marketplace.also.ch/SimpleAPI/SimpleAPIService.svc/rest}
      - MCP_API_KEY=${MCP_API_KEY}
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    ports:
      # Public reachability is what worked before (0.0.0.0) - access control
      # is the mandatory MCP_API_KEY bearer token, not the bind address.
      - "${MCP_HOST_PORT:-8424}:8000"
