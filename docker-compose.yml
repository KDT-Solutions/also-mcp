services:
  also-mcp:
    # Prebuilt image from GitHub Container Registry, built by GitHub Actions on
    # every push to main (.github/workflows/docker-publish.yml) - carries the
    # version and build commit that get_version reports. If the GHCR package
    # is private, Portainer needs a ghcr.io registry entry (PAT with
    # read:packages).
    image: ghcr.io/kdt-solutions/also-marketplace-mcp:latest
    # Pull the image from the registry on every deploy/redeploy instead of
    # reusing a possibly stale local :latest copy.
    pull_policy: always
    container_name: also-mcp-cloud
    restart: unless-stopped
    # Hardening: unprivileged user (see Dockerfile), read-only root filesystem,
    # no Linux capabilities, no privilege escalation. The server writes nothing to disk.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      - ALSO_API_USER=${ALSO_API_USER}
      - ALSO_API_PASSWORD=${ALSO_API_PASSWORD}
      - ALSO_BASE_URL=${ALSO_BASE_URL:-https://marketplace.also.ch/SimpleAPI/SimpleAPIService.svc/rest}
      - MCP_API_KEY=${MCP_API_KEY}
      # true: every write tool (create/update/terminate/upgrade, non-read raw calls) is disabled
      - MCP_READONLY=${MCP_READONLY:-false}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    ports:
      # Access only through the reverse proxy with TLS. Set MCP_BIND_ADDR to
      # the Docker host IP the proxy connects to; without MCP_BIND_ADDR the
      # service is only reachable on 127.0.0.1.
      - "${MCP_BIND_ADDR:-127.0.0.1}:${MCP_HOST_PORT:-8424}:8000"
