[project]
name = "also-marketplace-mcp"
version = "0.1.0"
description = "MCP server for the ALSO Cloud Marketplace SimpleAPI (subscriptions, companies, users, invoices)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
also-marketplace-mcp = "also_marketplace_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/also_marketplace_mcp"]
