[project]
name = "also-marketplace-mcp"
# Only major.minor is maintained by hand, the patch part is counted
# automatically from the git history (see _read_version in server.py).
version = "0.3.0"
description = "MCP server for the ALSO Cloud Marketplace SimpleAPI (subscriptions, companies, users, invoices)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
also-marketplace-mcp = "also_marketplace_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/also_marketplace_mcp"]
