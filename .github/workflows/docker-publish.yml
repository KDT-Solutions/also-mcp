name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the patch version (commit count) is correct
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"$/\1/p' pyproject.toml)
          count=$(git rev-list --count HEAD -- Dockerfile pyproject.toml src/ .github/workflows/docker-publish.yml)
          test -n "$base" && test -n "$count"
          echo "version=${base}.${count}" >> "$GITHUB_OUTPUT"
          echo "Version: ${base}.${count}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/also-marketplace-mcp" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
